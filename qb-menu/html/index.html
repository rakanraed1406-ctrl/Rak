<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Menu</title>
        <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
        <link rel="stylesheet" href="./style.css" />
        <script src="./script.js"></script>
    </head>
    <body>
        <div id="dim"></div>

        <div id="menu" aria-hidden="true">
            <div id="preview"><img id="previewImg" alt="" /></div>

            <div id="panel">
                <div id="head">
                    <div id="titleWrap"></div>
                </div>
                <div id="search"><input id="searchInput" type="text" dir="auto" placeholder="Search..." autocomplete="off" spellcheck="false"></div>
                <div id="list"></div>
                <div id="foot">
                    <span><b>↑↓</b> NAV</span>
                    <span><b>ENTER</b> SELECT</span>
                    <span><b>1-9</b> QUICK</span>
                    <span><b>ESC</b> CLOSE</span>
                </div>
            </div>
        </div>

        <script>
            // ---- Settings (change here) ----
            MenuConfig.searchFrom = 8; // search box when a menu has more options than this (0 = off)
            // Font Awesome is loaded only when a menu uses an icon class:
            MenuConfig.fontAwesome = 'https://kit-pro.fontawesome.com/releases/v6.5.0/css/pro.min.css';
        </script>
    </body>
</html>
