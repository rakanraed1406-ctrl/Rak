                <div class="stat-num">100</div>
            </div>
            <div class="stat fx up" id="st-stress" hidden>
                <div class="stat-fill"></div><div class="stat-lvl"></div>
                <svg class="ic"><use href="#i-brain"/></svg>
                <div class="stat-num">0</div>
            </div>
        </div>

        <!-- ── vehicle cluster ── -->
        <div class="car fx" id="car" hidden>
            <svg class="car-svg" viewBox="0 0 340 126">
                <defs>
                    <linearGradient id="gPlate" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#142a60" stop-opacity="0.93"/>
                        <stop offset="0.45" stop-color="#091534" stop-opacity="0.93"/>
                        <stop offset="1" stop-color="#030816" stop-opacity="0.95"/>
                    </linearGradient>
                    <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0" stop-color="#aac4ff" stop-opacity="0"/>
                        <stop offset="0.5" stop-color="#aac4ff" stop-opacity="0.35"/>
                        <stop offset="1" stop-color="#aac4ff" stop-opacity="0"/>
                    </linearGradient>
                    <linearGradient id="gRpm" gradientUnits="userSpaceOnUse" x1="12" y1="0" x2="280" y2="0">
                        <stop offset="0" stop-color="#1739b8"/>
                        <stop offset="0.45" stop-color="#3a6cff"/>
                        <stop offset="1" stop-color="#a8d4ff"/>
                    </linearGradient>
                    <linearGradient id="gRed" gradientUnits="userSpaceOnUse" x1="276" y1="0" x2="326" y2="0">
                        <stop offset="0" stop-color="#ffa05c"/>
                        <stop offset="1" stop-color="#ff2d55"/>
                    </linearGradient>
                    <linearGradient id="gBar" gradientUnits="userSpaceOnUse" x1="42" y1="0" x2="170" y2="0">
                        <stop offset="0" stop-color="#3a6cff"/>
                        <stop offset="1" stop-color="#b7d0ff"/>
                    </linearGradient>
                    <mask id="carMask" maskUnits="userSpaceOnUse" x="0" y="0" width="340" height="126">
                        <path id="m-rpm" fill="none" stroke="#fff" stroke-width="16" pathLength="100" stroke-dasharray="2 0.5"/>
                        <path id="m-fuel" fill="none" stroke="#fff" stroke-width="8" pathLength="100" stroke-dasharray="4 1"/>
                        <path id="m-eng" fill="none" stroke="#fff" stroke-width="8" pathLength="100" stroke-dasharray="4 1"/>
                    </mask>
                </defs>
                <path class="c-plate" id="p-plate"/>
                <path class="c-hl" d="M 30 0.5 H 300"/>
                <path class="c-glow" id="p-glow" pathLength="100" stroke-dashoffset="100"/>
                <g mask="url(#carMask)">
                    <path class="c-track" id="p-track"/>
                    <path class="c-track red" id="p-track-red"/>
                    <path class="c-rpm" id="p-rpm" pathLength="100" stroke-dashoffset="100"/>
                    <path class="c-rpm red" id="p-rpm-red" pathLength="100" stroke-dashoffset="100"/>
                    <path class="c-mtrack" id="p-fuel-track"/>
                    <path class="c-bar" id="p-fuel" pathLength="100" stroke-dashoffset="0"/>
                    <path class="c-mtrack" id="p-eng-track"/>
                    <path class="c-bar" id="p-eng" pathLength="100" stroke-dashoffset="0"/>
                </g>
            </svg>
            <svg class="ic c-mini-ic fuel" id="c-fuel-ic"><use id="fuel-use" href="#i-fuel"/></svg>
            <svg class="ic c-mini-ic eng" id="c-eng-ic"><use href="#i-engine"/></svg>
            <span class="c-val fuel" id="c-fuel-v">100</span>
            <span class="c-val eng" id="c-eng-v">100</span>

            <div class="c-speed" id="c-speed"><span class="z">0</span><span class="z">0</span><span>0</span></div>
            <div class="c-unit" id="c-unit">KM/H</div>

            <div class="c-gears" id="c-gears"></div>
            <div class="c-alt" id="c-alt" hidden>
                <svg class="ic"><use href="#i-plane"/></svg><i>ALT</i><b id="c-alt-v">0</b><i>M</i>
            </div>

            <div class="c-icons">
                <svg class="ic sig" id="ci-left"><use href="#i-signal"/></svg>
                <svg class="ic" id="ci-lock"><use href="#i-lock"/></svg>
                <svg class="ic" id="ci-lights"><use id="ci-lights-use" href="#i-lowbeam"/></svg>
                <svg class="ic belt" id="ci-belt"><use href="#i-belt"/></svg>
                <svg class="ic" id="ci-brake"><use href="#i-brake"/></svg>
                <svg class="ic" id="ci-engine"><use href="#i-motor"/></svg>
                <svg class="ic" id="ci-cruise"><use href="#i-cruise"/></svg>
                <svg class="ic sig r" id="ci-right"><use href="#i-signal"/></svg>
            </div>
        </div>

    </div><!-- #hud -->
    </div><!-- .ui-scale -->

    <!-- ── watermark (independent of the HUD, toggled with F9) ── -->
    <div class="wm" id="wm">
        <div class="wm-txt" id="wm-txt">DIS.GG/JTCFW</div>
        <div class="wm-line"></div>
    </div>

    <script src="hud.js"></script>
</body>
</html>
