    <!-- HTML code -->
    <div id="container"></div>

    <script type="text/javascript">
        (function () {
            // ---- Sound settings for the wheel (change here) ----
            WheelSfx.enabled = true;
            WheelSfx.volume = 0.35;

            var resource = RadialMenu.resource();
            var menuKeybind = '';
            var menu = null;

            function post(name, data) {
                return fetch('https://' + resource + '/' + name, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data || {})
                }).catch(function () {});
            }

            window.addEventListener('message', function (event) {
                var eventData = event.data || {};
                if (eventData.menuKeyBind) menuKeybind = eventData.menuKeyBind;

                if (eventData.state === 'show') {
                    if (menu) { menu.destroy(); menu = null; }
                    var navMenu = document.createElement('div');
                    navMenu.className = 'navMenu';
                    document.getElementById('container').appendChild(navMenu);
                    menu = new RadialMenu({
                        parent: navMenu,
                        size: 470,
                        closeOnClick: false,
                        menuItems: eventData.data || [],
                        onClick: function (item) {
                            if (!item.uid) return;
                            // one request: the client closes the wheel first (if needed), then runs the option
                            if (item.close && menu) menu.collapse();
                            post('select', { uid: item.uid });
                        }
                    });
                    menu.open();
                } else if (eventData.state === 'destroy') {
                    if (menu) {
                        var old = menu;
                        menu = null;
                        old.destroy();
                        var holder = old.parent;
                        setTimeout(function () { if (holder && holder.parentNode) holder.parentNode.removeChild(holder); }, 280);
                    }
                }
            });

            // Close when the menu key is released (hold-to-use, same as before)
            window.addEventListener('keyup', function (event) {
                if (menuKeybind && String(event.key).toLowerCase() === String(menuKeybind).toLowerCase()) post('closemenu', {});
            });
        })();
    </script>
