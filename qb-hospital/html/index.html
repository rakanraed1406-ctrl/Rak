<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>qb-hospital death screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="death-screen" class="hidden">
        <div class="vignette"></div>

        <div class="content">
            <div class="monitor">
                <canvas id="ecg"></canvas>
                <div class="timer" id="timer">00:00</div>
            </div>

            <div class="status" id="status"></div>
            <div class="sub" id="sub" dir="auto"></div>

            <div class="actions">
                <div class="action" id="help">
                    <div class="key"><span>G</span></div>
                    <div class="label" id="help-label" dir="auto"></div>
                </div>

                <div class="action" id="respawn">
                    <div class="key">
                        <svg class="ring" viewBox="0 0 40 40">
                            <rect class="ring-track" x="1.5" y="1.5" width="37" height="37" rx="8" pathLength="100"></rect>
                            <rect class="ring-fill" id="respawn-ring" x="1.5" y="1.5" width="37" height="37" rx="8" pathLength="100"></rect>
                        </svg>
                        <span>E</span>
                    </div>
                    <div class="label" id="respawn-label" dir="auto"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
