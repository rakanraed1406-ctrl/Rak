<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Input</title>
        <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
        <link id="qiStyle" rel="stylesheet" href="./styles/default.css" />
        <script src="./script.js"></script>
    </head>
    <body>
        <div id="dim"></div>

        <div id="panel" role="dialog" aria-modal="true">
            <div id="head">
                <div id="title">Form Title</div>
                <button type="button" id="close" aria-label="Close">&times;</button>
            </div>
            <form id="form" autocomplete="off" novalidate>
                <div id="fields"></div>
                <div id="foot">
                    <button type="button" id="cancel" class="qi-btn qi-btn-ghost">Cancel</button>
                    <button type="submit" id="submit" class="qi-btn qi-btn-main">Confirm</button>
                </div>
            </form>
        </div>
    </body>
</html>
