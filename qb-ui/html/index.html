<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Command UI</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://kit-pro.fontawesome.com/releases/v6.2.0/css/pro.min.css">
        <link rel="stylesheet" href="css/ui.css" />
        <script src="js/ui.js"></script>
    </head>
    <body>
        <!-- Info overlay (DrawBlackUi / HideBlackUi) -->
        <div id="info">
            <div id="infoBox"><span class="ui-dot"></span><div id="infoText"></div></div>
        </div>

        <!-- Notifications -->
        <div id="notes"></div>

        <!-- DrawText -->
        <div id="dt">
            <div id="dtKey"></div>
            <div id="dtText"></div>
        </div>

        <!-- Lockpick circle -->
        <div id="lp">
            <canvas id="lpCanvas"></canvas>
            <div id="lpDots"></div>
            <div id="lpHint"><b>1-4</b> PRESS THE KEY IN THE ZONE · <b>ESC</b> GIVE UP</div>
        </div>

        <script>
            // ---- Sound settings (change here) ----
            UiSfx.enabled = true;
            UiSfx.volume = 0.35;
            UiSfx.parts = { drawtext: true, notify: true, lockpick: true, info: true };
        </script>
    </body>
</html>
