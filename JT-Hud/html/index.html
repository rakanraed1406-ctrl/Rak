<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JT HUD</title>
    <!-- fonts and icons load without blocking the page -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- full-screen effects (outside the scaled layer) -->
<div id="low-health"></div>

<div class="ui-scale" id="ui-scale">

    <!-- ── Top right: clock, ammo, money ── -->
    <div id="top-right">
        <div class="clock-card">
            <div class="clock-time" id="time">00:00</div>
            <div class="clock-meta">
                <span class="clock-ampm" id="ampm">AM</span>
                <span class="clock-date" id="date">JANUARY 1</span>
            </div>
        </div>

        <div class="ammo" id="ammo">
            <i class="fa-solid fa-gun ammo-icon"></i>
            <span class="ammo-clip" id="ammo-clip">0</span>
            <span class="ammo-sep">/</span>
            <span class="ammo-reserve" id="ammo-reserve">00</span>
            <span class="ammo-reload" id="ammo-reload">RELOAD</span>
        </div>

        <div class="money" id="money">
            <div class="money-icon"><i class="fa-solid fa-wallet" id="money-icon"></i></div>
            <div class="money-body">
                <div class="money-balance">$<span id="money-balance">0</span></div>
                <div class="money-delta" id="money-delta"></div>
            </div>
        </div>

        <div class="toasts" id="toasts"></div>
    </div>

    <!-- ── Compass (in vehicles) ── -->
    <div class="compass" id="compass">
        <div class="compass-tape"><div class="compass-strip" id="compass-strip"></div></div>
        <div class="compass-marker"></div>
        <div class="compass-deg" id="compass-deg">000°</div>
    </div>

    <!-- ── Navigation card above the minimap ── -->
    <div class="nav" id="nav">
        <div class="nav-arrow" id="nav-arrow"><i class="fa-solid fa-location-dot" id="nav-icon"></i></div>
        <div class="nav-text">
            <div class="nav-area" id="nav-area">LOS SANTOS</div>
            <div class="nav-street" id="nav-street">Unknown</div>
        </div>
        <div class="nav-dist" id="nav-dist"></div>
    </div>

    <!-- ── Frame around the game minimap ── -->
    <div class="map-frame" id="map-frame">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <span class="scan"></span>
    </div>

    <!-- ── Status rings ── -->
    <div class="status" id="status"></div>

    <!-- ── Vehicle dashboard ── -->
    <div class="dash" id="dash">
        <svg class="gauge" viewBox="0 0 240 240">
            <defs>
                <linearGradient id="rpmGrad" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0%"  stop-color="#1d6bff"/>
                    <stop offset="55%" stop-color="#3da2ff"/>
                    <stop offset="80%" stop-color="#7fd4ff"/>
                    <stop offset="100%" stop-color="#ff4d5e"/>
                </linearGradient>
                <radialGradient id="discGrad" cx="50%" cy="45%" r="60%">
                    <stop offset="0%"  stop-color="rgba(20,34,58,0.92)"/>
                    <stop offset="100%" stop-color="rgba(6,11,22,0.94)"/>
                </radialGradient>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3.2" result="b"/>
                    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>
            <circle class="disc" cx="120" cy="120" r="116"/>
            <circle class="disc-ring" cx="120" cy="120" r="116"/>
            <g id="ticks"></g>
            <path class="rpm-track" id="rpm-track"/>
            <path class="rpm-red" id="rpm-red"/>
            <path class="rpm-fill" id="rpm-fill" filter="url(#glow)"/>
            <circle class="rpm-head" id="rpm-head" r="5" filter="url(#glow)"/>
            <path class="mini-track" id="fuel-track"/>
            <path class="mini-fill fuel" id="fuel-fill"/>
            <path class="mini-track" id="eng-track"/>
            <path class="mini-fill eng" id="eng-fill"/>
        </svg>

        <i class="fa-solid fa-gas-pump mini-icon fuel-icon" id="fuel-icon"></i>
        <i class="fa-solid fa-oil-can mini-icon eng-icon" id="eng-icon"></i>

        <div class="speed">
            <div class="speed-num" id="speed"><span class="dim">0</span><span class="dim">0</span><span>0</span></div>
            <div class="speed-unit" id="speed-unit">KM/H</div>
        </div>

        <div class="gear" id="gear"><span id="gear-num">N</span></div>
        <div class="alt" id="alt">ALT <b id="alt-val">0</b> M</div>

        <div class="indicators">
            <div class="ind belt" id="ind-belt" title="Seatbelt"><i class="fa-solid fa-user-slash"></i></div>
            <div class="ind lights" id="ind-lights" title="Lights"><i class="fa-solid fa-lightbulb"></i></div>
            <div class="ind cruise" id="ind-cruise" title="Cruise"><i class="fa-solid fa-gauge-high"></i></div>
            <div class="ind engine" id="ind-engine" title="Engine"><i class="fa-solid fa-triangle-exclamation"></i></div>
        </div>
    </div>

    <!-- ── Watermark ── -->
    <div class="watermark" id="watermark">
        <div class="wm-text">DIS.GG/JTCFW</div>
        <div class="wm-line"></div>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
